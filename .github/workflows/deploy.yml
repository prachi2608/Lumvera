name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - firebase

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
        working-directory: lead-gen-website

      - name: Install dependencies
        run: npm ci
        working-directory: lead-gen-website

      - name: Build project
        run: npm run build
        working-directory: lead-gen-website

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v13.0.1
        with:
          args: deploy --only hosting --project lumvera-c231c
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        working-directory: lead-gen-website
