name: Deploy to Firebase Hosting

# Dummy comment to trigger deployment test

# Another dummy comment

# Final test comment

on:
  push:
    branches:
      - main
      - firebase

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'lead-gen-website/package-lock.json'

      - name: Install dependencies
        run: cd lead-gen-website && npm ci

      - name: Build project
        run: cd lead-gen-website && npm run build

      - name: Authenticate to Firebase
        run: |
          cat > $HOME/service-account-key.json << EOF
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          EOF
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/service-account-key.json

      - name: Deploy to Firebase
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/service-account-key.json
          cd lead-gen-website && npx firebase-tools deploy --only hosting --project lumvera-c231c
