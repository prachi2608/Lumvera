name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - firebase

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'lead-gen-website/package-lock.json'

      - name: Install dependencies
        run: cd lead-gen-website && npm ci

      - name: Build project
        run: cd lead-gen-website && npm run build

      - name: Authenticate to Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > $HOME/service-account-key.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/service-account-key.json

      - name: Deploy to Firebase
        run: cd lead-gen-website && npx firebase-tools deploy --only hosting --project lumvera-c231c
        env:
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/service-account-key.json
