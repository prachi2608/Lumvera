name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - firebase

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: cd lead-gen-website && npm ci

      - name: Build project
        run: cd lead-gen-website && npm run build

      - name: Deploy to Firebase
        run: cd lead-gen-website && npx firebase-tools deploy --only hosting --project lumvera-c231c --token $FIREBASE_TOKEN
